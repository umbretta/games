<title>Fuse</title>
<style>

<script id="gen-src">
'use strict';
/* GEN-START */
// ---------- levels, built on the fly from the level number ----------
// Each level has its own difficulty band. The bands rise with the level number and never overlap.
// To build level L: start from a puzzle seeded by L, then make small changes that keep it winnable
// (swap rockets, move a rocket to the next fuse, add or remove a lock or chain, split or merge fuses,
// add or drop a colour, a dud or a hook), keeping whichever change moves the difficulty closest to L's band,
// until it lands inside. Same level number, same steps, same puzzle; and every level is harder than the one before.
const RAMP = 1000, HOOKS = 4, MAX_BANDS = 9, Q = 1e6; // there is no last level
const PALETTE = ['#ff4d6d', '#ffc300', '#3ddc84', '#3a86ff', '#b967ff', '#00d4e0', '#f4f4ff', '#ff7ad9'];
const INTRO = { chain: 25, lock: 50, dud: 75, twin: 100, mystery: 125, small: 150 };
const DUD = -1; // a dud rocket matches nothing; it sits on a hook until the next burst of three knocks it off
function rng(seed) {
  let a = seed >>> 0;
  const r = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  r.int = n => r() * n | 0;
  r.range = (a, b) => a + r.int(b - a + 1);
  r.shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = r.int(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return r;
}
// difficulty = solver score (how unlikely a random lighting order is to win) + board size
// (small boards only reach a few scores, so the first levels climb in bigger steps)
const W = { T: 1, D: 0.35, M: 0.06 };
// levels 1..1000 climb, each strictly harder than the one before; after that there is no end:
// every level gets its own seeded band among the hardest boards (boards can't keep getting harder forever)
const climb = L => 0.49 + 6.6 * Math.pow((L - 1) / (RAMP - 1), 0.3) + 0.5 * (1 - Math.exp(-(L - 1) / 5));
const target = climb;
const edge = L => L <= 1 ? -Infinity : L > RAMP ? Infinity : Math.round((target(L - 1) + target(L)) / 2 * Q);
function band(L) { // [lo, hi) of level L's difficulty score
  if (L <= RAMP) return [edge(L), edge(L + 1)];
  const lo = 6.8 + rng(L * 104729 + 3)() * 1.2; // endless levels: all hard, each a little different
  return [Math.round(lo * Q), Math.round((lo + 0.15) * Q)];
}
function limits(L) {
  const upTo = (intro, max, per) => L < intro ? 0 : Math.min(max, 1 + Math.floor((L - intro) / per));
  const kMax = L <= 2 ? L + 1 : Math.min(8, 4 + Math.floor(L / 30));
  return {
    kLo: L <= 2 ? L + 1 : Math.max(3, Math.min(kMax, 3 + Math.floor(L / 50))), kMax, kMin: 2,
    eMax: L < 15 ? 0 : Math.min(4, 1 + Math.floor(L / 60)),
    chain: [L === INTRO.chain ? 1 : 0, upTo(INTRO.chain, 3, 60)],
    lock: [L === INTRO.lock ? 1 : 0, upTo(INTRO.lock, 3, 60)],
    twin: [L === INTRO.twin ? 1 : 0, upTo(INTRO.twin, 2, 100)],
    dud: [L === INTRO.dud ? 1 : 0, upTo(INTRO.dud, 3, 100)],
    mys: [L === INTRO.mystery ? 1 : 0, L < INTRO.mystery ? 0 : Math.min(8, 2 + Math.floor((L - INTRO.mystery) / 60))],
    // from level 150 a set share of levels (25% rising to 60%) have a three-hook rack
    hooks: L < INTRO.small ? [4] : L === INTRO.small || rng(L * 31 + 7)() < 0.25 + 0.35 * Math.min(1, (L - INTRO.small) / (RAMP - INTRO.small)) ? [3] : [4]
  };
}
// a firing order that never fills the rack, as long as the fuses are lit in the right order
function safeOrder(counts, r, hooks) {
  const total = counts.reduce((a, b) => a + b, 0);
  for (let tries = 0; tries < 200; tries++) {
    const left = counts.slice(), held = counts.map(() => 0), seq = [];
    while (seq.length < total) {
      const opts = [];
      for (let c = 0; c < counts.length; c++) {
        if (!left[c]) continue;
        const sum = held.reduce((a, b) => a + b, 0) - held[c] + (held[c] + 1) % 3;
        if (sum < hooks) opts.push(c);
      }
      const fits = (h, c) => h.reduce((a, b) => a + b, 0) - h[c] + (h[c] + 1) % 3 < hooks;
      const live = opts.filter(c => {
        if (seq.length + 1 === total) return true;
        const h = held.slice(); h[c] = (h[c] + 1) % 3;
        return counts.some((_, x) => left[x] - (x === c) > 0 && fits(h, x));
      });
      if (!live.length) break;
      const c = live[r.int(live.length)];
      seq.push(c); left[c]--; held[c] = (held[c] + 1) % 3;
    }
    if (seq.length === total) return seq;
  }
  return null;
}
// solver: units are things you can light (a twin pair is one unit); state = set of finished units plus
// the duds on the rack. Returns two chances of winning: lighting any unit at random (P), and a careful player who
// never lights a fuse that overflows the rack on its own (Ps). Losses the careful player still walks into are traps.
function solve(lv) {
  const U = lv.units, m = U.length, full = (1 << m) - 1, K = lv.cols.length;
  const memoR = new Float64Array(4 << m).fill(-1), memoS = new Float64Array(4 << m).fill(-1);
  const countsOf = mask => { const c = new Array(K).fill(0); for (let u = 0; u < m; u++) if (mask >> u & 1) for (const x of U[u].seq) if (x >= 0) c[x]++; return c; };
  function run(mask, d, u) {
    const cnt = countsOf(mask);
    while (true) {
      for (const x of U[u].seq) {
        if (x < 0) d++; else if (++cnt[x] % 3 === 0) d = 0;
        let held = d; for (let c = 0; c < K; c++) held += cnt[c] % 3;
        if (held >= lv.hooks) return -1;
      }
      mask |= 1 << u;
      const nx = U[u].next;
      if (nx < 0 || (mask >> nx & 1)) return mask * 4 + d;
      u = nx;
    }
  }
  function P(st) {

  if (me) { b.textContent = initial(me); b.style.setProperty('--k', PALETTE[me.color]); b.title = me.name + ' · switch player'; }
  else { b.textContent = '+'; b.style.removeProperty('--k'); b.title = 'Players'; }
}
function useProfile(p) {
  saveProfiles(); me = p; profiles.active = p.id; adopt(p); saveProfiles(); renderMe(); game.newLevel();
}
function removeProfile(p) {
  profiles.list = profiles.list.filter(q => q !== p);
  if (p === me) {
    me = null; profiles.active = null;
    if (profiles.list.length) useProfile(profiles.list[0]);
    else { best = 0; level = 1; saveProfiles(); renderMe(); game.newLevel(); }
  } else saveProfiles();
  renderProfiles();
}
function openProfiles() {
  newColor = Math.max(0, PALETTE.findIndex((_, i) => !profiles.list.some(p => p.color === i))); // first colour nobody here uses
  $('pmsg').textContent = ''; $('lmsg').textContent = ''; renderProfiles(); $('prof').classList.add('show'); syncPause(); }
function closeProfiles() { if (!me) return; $('prof').classList.remove('show'); syncPause(); }
function renderProfiles() {
  const first = !me;
  $('profT').textContent = first ? "Who's playing?" : 'Players';
  $('profSub').textContent = first ? 'Make a player to save your progress.' : 'Tap a player to switch.';
  $('profX').hidden = first;
  $('pformT').textContent = first ? 'Your name' : 'New player';
  const list = $('plist'); list.textContent = ''; list.hidden = !profiles.list.length;
  for (const p of profiles.list) {
    const row = document.createElement('div'); row.className = 'prow' + (p === me ? ' on' : '');
    const pick = document.createElement('button'); pick.className = 'ppick'; pick.type = 'button';
    const av = document.createElement('span'); av.className = 'av'; av.textContent = initial(p); av.style.setProperty('--k', PALETTE[p.color]);
    const txt = document.createElement('span'); txt.className = 'ptxt';
    const nm = document.createElement('b'); nm.textContent = p.name;
    const st = document.createElement('small'); st.textContent = (p.admin ? 'Admin · ' : '') + (p === me ? 'Playing now · ' : 'Level ' + p.level + ' · ') + p.best + ' cleared';
    txt.append(nm, st); pick.append(av, txt);
    pick.onclick = () => { sfx.ui(); if (p !== me) useProfile(p); closeProfiles(); };
    const del = document.createElement('button'); del.className = 'pdel'; del.type = 'button'; del.textContent = 'Delete';
    del.setAttribute('aria-label', 'Delete ' + p.name);
    del.onclick = () => {
      if (!del.classList.contains('sure')) { // second tap confirms
        del.classList.add('sure'); del.textContent = 'Sure?';
        setTimeout(() => { del.classList.remove('sure'); del.textContent = 'Delete'; }, 2500);
        return;
      }
      sfx.ui(); removeProfile(p);
    };
    row.append(pick, del); list.append(row);
  }
  const sw = $('pcols'); sw.textContent = '';
  PALETTE.forEach((c, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sw' + (i === newColor ? ' on' : '');
    b.style.setProperty('--k', c); b.setAttribute('aria-label', 'Colour ' + (i + 1));
    b.onclick = () => { newColor = i; [...sw.children].forEach((x, j) => x.classList.toggle('on', j === i)); };
    sw.append(b);
  });
  $('ptrans').hidden = first;
  if (me) { saveProfiles(); $('pcode').textContent = encodeSave(me); }
}
$('pform').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('pname').value.replace(/\s+/g, ' ').trim().slice(0, 14), msg = $('pmsg');
  msg.className = 'pmsg';
  if (!name) { msg.textContent = 'Type a name first.'; $('pname').focus(); return; }
  if (profiles.list.some(p => p.name.toLowerCase() === name.toLowerCase())) { msg.textContent = 'There is already a player called ' + name + ' on this device.'; return; }
  const p = newProfile(name, newColor); profiles.list.push(p); $('pname').value = ''; msg.textContent = '';
  sfx.ui(); useProfile(p); closeProfiles();
});
$('lform').addEventListener('submit', async e => {
  e.preventDefault();
  const d = decodeSave($('lcode').value), msg = $('lmsg');
  msg.className = 'pmsg';
  if (!d && me && await isAdminKey($('lcode').value)) { // the admin key turns admin on or off for this player
    me.admin = !me.admin; if (!me.admin) delete me.admin;
    adopt(me); saveProfiles(); $('lcode').value = ''; renderMe(); renderProfiles();
    msg.className = 'pmsg ok';
    msg.textContent = me.admin ? me.name + ' is now an admin: every level is open in the level grid.' : 'Admin turned off for ' + me.name + '.';
    return;
  }
  if (!d) { msg.textContent = "That code isn't right. Check the code and try again."; return; }
  if (d.best <= me.best) { msg.textContent = me.name + ' has already cleared ' + me.best + ' levels, so nothing changed.'; return; }
  me.color = d.color; adopt(d); saveProfiles(); $('lcode').value = '';
  renderMe(); game.newLevel(); renderProfiles();
  msg.className = 'pmsg ok'; msg.textContent = 'Progress loaded: ' + d.best + (d.best === 1 ? ' level' : ' levels') + ' cleared.';
});
$('pcopy').onclick = () => {
  const code = $('pcode').textContent, btn = $('pcopy');
  const selectIt = () => { const r = document.createRange(); r.selectNodeContents($('pcode')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try {
    navigator.clipboard.writeText(code).then(() => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy', 1500); }, selectIt);
  } catch (err) { selectIt(); }
};
$('me').onclick = () => { sfx.ui(); openProfiles(); };
$('profX').onclick = () => { sfx.ui(); closeProfiles(); };

/* ---------- boot ---------- */
if (game.undo) $('undo').onclick = game.undo; else $('undo').style.display = 'none';
$('restart').onclick = () => { if (building) return; sfx.ui(); game.restart(); };
$('lvl').onclick = () => { sfx.ui(); openLevels(); };
$('selX').onclick = () => { sfx.ui(); closeLevels(); };
$('mute').onclick = () => {
  muted = !muted; $('mute').classList.toggle('off', muted);
  try { localStorage.setItem(KEY + '.muted', muted ? '1' : '0'); } catch (e) {}
  sfx.ui();
};
$('mute').classList.toggle('off', muted);
renderMe();
game.newLevel();
if (!me) openProfiles();
</script>
</body>
</html>
