<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Snap Band</title>
<style>
  :root {
    --bg1: #1b1035; --bg2: #0d0a1f; --a: #ff4d6d; --b: #3a86ff; --c: #b967ff;
    --card1: #2b1a55; --card2: #1a1036;
    --panel: rgba(255,255,255,.07); --line: rgba(255,255,255,.14); --text: #f4f6ff; --muted: #a7aecb;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text); overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    background:
      radial-gradient(60vmax 60vmax at 0% -5%, color-mix(in srgb, var(--a) 28%, transparent), transparent 60%),
      radial-gradient(55vmax 55vmax at 105% 15%, color-mix(in srgb, var(--b) 28%, transparent), transparent 60%),
      radial-gradient(70vmax 60vmax at 50% 118%, color-mix(in srgb, var(--c) 30%, transparent), transparent 60%),
      linear-gradient(165deg, var(--bg1), var(--bg2));
  }
  #app {
    height: 100dvh; max-width: 440px; margin: 0 auto; padding: 14px 16px 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  header { display: flex; align-items: center; gap: 10px; }
  h1 {
    margin: 0; font-size: 25px; font-weight: 900; letter-spacing: .5px; flex: 1; white-space: nowrap;
    background: linear-gradient(90deg, var(--a), var(--b) 55%, var(--c));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pill {
    font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: 999px; white-space: nowrap;
    background: var(--panel); border: 1px solid var(--line);
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .icon {
    width: 38px; height: 38px; border-radius: 12px; font-size: 18px; font-weight: 800; flex: none;
    background: var(--panel); border: 1px solid var(--line); transition: transform .12s;
  }
  .icon:active { transform: scale(.9); }
  .icon.off { opacity: .45; text-decoration: line-through; }
  #board {
    flex: 1; min-height: 0; border-radius: 26px; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1.2px, transparent 1.6px) 0 0 / 22px 22px,
      linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.03));
    border: 1px solid var(--line);
    box-shadow: inset 0 0 50px rgba(0,0,0,.3), 0 18px 40px rgba(0,0,0,.35);
  }
  #board svg { width: 100%; height: 100%; display: block; }
  #tip { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; margin: -2px 0; }
  #foot {
    display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px 16px; min-height: 66px;
    border-radius: 22px; background: var(--panel); border: 1px solid var(--line);
  }
  .bit { position: fixed; z-index: 30; width: 9px; height: 9px; border-radius: 3px; pointer-events: none; }
  #ov {
    position: fixed; inset: 0; z-index: 40; display: none; place-items: center;
    background: rgba(6,6,18,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #ov.show { display: grid; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop-in { from { transform: scale(.6); } }
  .card {
    width: min(300px, 82vw); padding: 26px 22px; border-radius: 26px; text-align: center;
    background: linear-gradient(180deg, var(--card1), var(--card2)); border: 1px solid var(--line);
    box-shadow: 0 24px 60px rgba(0,0,0,.6); animation: pop-in .35s cubic-bezier(.3,1.6,.5,1);
  }
  .card h2 { margin: 0 0 6px; font-size: 28px; font-weight: 900; }
  .card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .btns { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 13px 10px; border-radius: 16px; font-weight: 800; font-size: 15px;
    background: linear-gradient(180deg, #ffd166, #ff9f1c); color: #2a1500;
    box-shadow: 0 5px 0 #b86a00; transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b86a00; }
  .btn.alt { background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.14)); color: var(--text); box-shadow: 0 5px 0 rgba(0,0,0,.45); }
  :root { --bg1: #2b1630; --bg2: #100a1c; --a: #ff6fb5; --b: #ffb703; --c: #3ddc84; --card1: #55245c; --card2: #24102e; }
  #board svg { touch-action: none; cursor: crosshair; }
  .peg { fill: #d9d2ee; stroke: rgba(0,0,0,.45); stroke-width: 1.5; }
  .bead circle { stroke: rgba(0,0,0,.38); stroke-width: 2.5; }
  .bead { transform-box: fill-box; transform-origin: center; animation: pop-in .3s cubic-bezier(.3,1.6,.5,1) backwards; }
  #band { fill: rgba(255,255,255,.08); stroke-width: 7; stroke-linejoin: round; pointer-events: none; display: none;
          filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  #band.on { display: block; }
  #band.bad { stroke: #ff4d6d; stroke-dasharray: 10 8; fill: rgba(255,77,109,.12); }
  #band.none { stroke: rgba(255,255,255,.4); }
  #band.shake { animation: shake .3s; }
  #band.snap { animation: snap .3s forwards; transform-box: fill-box; transform-origin: center; }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  @keyframes snap { to { transform: scale(.2); opacity: 0; } }
  .loop {
    width: 30px; height: 30px; border-radius: 50%; border: 6px solid var(--a);
    box-shadow: 0 0 12px color-mix(in srgb, var(--a) 60%, transparent), inset 0 0 0 1px rgba(0,0,0,.3); transition: all .3s;
  }
  .loop.used { border-color: rgba(255,255,255,.14); box-shadow: none; transform: scale(.75); }
  #foot { gap: 9px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="backBtn" title="All games" aria-label="Back to all games" onclick="location.href='../'">←</button>
    <h1>SNAP BAND</h1>
    <span class="pill" id="lvl">Level 1</span>
    <button class="icon" id="undo" title="Undo" aria-label="Undo">↶</button>
    <button class="icon" id="restart" title="Restart" aria-label="Restart">↻</button>
    <button class="icon" id="mute" title="Sound" aria-label="Sound">♪</button>
  </header>
  <div id="board">
    <svg id="svg" viewBox="0 0 360 420" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div id="tip"></div>
  <div id="foot"></div>
</div>
<div id="ov"><div class="card"><h2 id="ovT"></h2><p id="ovP"></p><div class="btns" id="ovB"></div></div></div>

<script>
'use strict';
/* ---------- shared helpers ---------- */
const KEY = 'snapband', NS = 'http://www.w3.org/2000/svg';
const PALETTE = ['#ff4d6d', '#ffb703', '#3ddc84', '#3a86ff', '#b967ff', '#00d4e0'];
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = n => Math.random() * n | 0;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = pick(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const center = e => { const b = e.getBoundingClientRect(); return [b.left + b.width / 2, b.top + b.height / 2]; };
const buzz = p => { if (navigator.vibrate) navigator.vibrate(p); };
function el(name, attrs, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
let level = 1, muted = false;
try { level = Math.max(1, +localStorage.getItem(KEY + '.level') || 1); muted = localStorage.getItem(KEY + '.muted') === '1'; } catch (e) {}

/* ---------- sound ---------- */
let ac, master, wet;
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .55;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    wet = ac.createGain(); wet.gain.value = .28;
    const delay = ac.createDelay(); delay.delayTime.value = .17;
    const fb = ac.createGain(); fb.gain.value = .32;
    wet.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(comp);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, d, o = {}) {
  if (muted) return;
  const a = audio(), s = a.currentTime + (o.t || 0), osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, s);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, s + d);
  g.gain.setValueAtTime(.0001, s);
  g.gain.exponentialRampToValueAtTime(o.v || .3, s + .012);
  g.gain.exponentialRampToValueAtTime(.0001, s + d);
  osc.connect(g); g.connect(master); if (o.echo) g.connect(wet);
  osc.start(s); osc.stop(s + d + .03);
}
function whoosh(d, from, to, v = .25, t = 0) {
  if (muted) return;
  const a = audio(), s = a.currentTime + t, n = Math.ceil(a.sampleRate * d);
  const buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.3;
  f.frequency.setValueAtTime(from, s); f.frequency.exponentialRampToValueAtTime(to, s + d);
  g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(v, s + d * .25);
  g.gain.exponentialRampToValueAtTime(.0001, s + d);
  src.connect(f); f.connect(g); g.connect(master); src.start(s);
}
const sfx = {
  pop(f = 520, t = 0) { tone(f, .1, { to: f * .6, v: .34, t }); tone(f * 2.2, .05, { type: 'triangle', v: .1, t }); },
  blocked() { tone(150, .1, { to: 95, type: 'square', v: .16 }); tone(130, .12, { to: 80, type: 'square', v: .16, t: .11 }); },
  clear() { [587, 740, 880, 1175].forEach((f, i) => { tone(f, .3, { t: i * .07, v: .26, echo: 1 }); tone(f * 2, .2, { t: i * .07, type: 'triangle', v: .08, echo: 1 }); }); },
  win() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .35, { t: i * .09, type: 'triangle', v: .26, echo: 1 }));
          [523, 659, 784, 1047].forEach(f => tone(f, .9, { t: .6, v: .16, echo: 1 })); },
  fail() { [392, 330, 262, 196].forEach((f, i) => tone(f, .28, { t: i * .14, to: f * .94, type: 'sawtooth', v: .13 })); },
  undo() { tone(700, .1, { to: 420, type: 'triangle', v: .22 }); },
  ui() { tone(620, .07, { to: 820, type: 'triangle', v: .18 }); }
};

/* ---------- effects and overlay ---------- */
function burst(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div'); b.className = 'bit';
    b.style.cssText = `left:${x - 4}px;top:${y - 4}px;background:${color}`;
    document.body.append(b);
    const ang = rnd(0, Math.PI * 2), dist = rnd(30, 95);
    b.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 },
               { transform: `translate(${Math.cos(ang) * dist}px,${Math.sin(ang) * dist + 30}px) scale(.2) rotate(${rnd(-360, 360)}deg)`, opacity: 0 }],
              { duration: rnd(450, 800), easing: 'cubic-bezier(.1,.7,.3,1)' }).onfinish = () => b.remove();
  }
}
function show(title, text, buttons) {
  $('ovT').textContent = title; $('ovP').textContent = text;
  const box = $('ovB'); box.textContent = '';
  for (const [label, fn, cls] of buttons) {
    const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label;
    b.onclick = () => { sfx.ui(); fn(); }; box.append(b);
  }
  $('ov').classList.add('show');
}
const hide = () => $('ov').classList.remove('show');
function startLevel(tip) {
  $('lvl').textContent = 'Level ' + level; $('tip').textContent = tip || ''; hide();
  try { localStorage.setItem(KEY + '.level', level); } catch (e) {}
}
function win(title) {
  sfx.win();
  for (let i = 0; i < 7; i++) setTimeout(() => burst(rnd(40, innerWidth - 40), rnd(80, innerHeight * .6), PALETTE[i % PALETTE.length], 16), i * 110);
  setTimeout(() => show(title, 'Level ' + level + ' cleared.', [['Next level', () => { level++; game.newLevel(); }]]), 650);
}
function lose(title, text) {
  sfx.fail(); buzz([60, 40, 60]);
  setTimeout(() => show(title, text, game.undo ? [['Undo', game.undo, 'alt'], ['Retry', game.restart]] : [['Retry', game.restart]]), 600);
}

/* ---------- the game ---------- */
const svg = $('svg');
let C = 4, R = 4, S = 60, ox = 0, oy = 0, grid = [], start = [], bands = 0, left = 0, history = [], ended = false, drag = null, band;

// Built backwards from an empty board: each step adds one colour inside a rectangle that holds
// no other colour, so the board can always be cleared.
function generate(cols, rows, k, steps, maxSide) {
  const g = Array.from({ length: rows }, () => Array(cols).fill(-1));
  for (let j = 0; j < steps; j++) for (let t = 0; t < 80; t++) {
    const w = Math.min(cols, 1 + pick(maxSide)), h = Math.min(rows, 1 + pick(maxSide));
    const c0 = pick(cols - w + 1), r0 = pick(rows - h + 1), col = pick(k), empty = [];
    let ok = true;
    for (let r = r0; r < r0 + h; r++) for (let c = c0; c < c0 + w; c++) {
      if (g[r][c] === -1) empty.push([r, c]); else if (g[r][c] !== col) ok = false;
    }
    if (!ok || !empty.length) continue;
    shuffle(empty).slice(0, Math.max(1, Math.round(empty.length * rnd(.6, 1)))).forEach(([r, c]) => g[r][c] = col);
    break;
  }
  return g;
}
// Fewest bands that clear the board, or 0 if it takes more than `limit` (or the search budget runs out).
// Only the largest catches are tried: taking extra beads of the same colour never hurts.
function minBands(grid, limit) {
  const R = grid.length, C = grid[0].length; let budget = 60000;
  const moves = g => {
    const sets = new Set();
    for (let r0 = 0; r0 < R; r0++) for (let c0 = 0; c0 < C; c0++) for (let r1 = r0; r1 < R; r1++) for (let c1 = c0; c1 < C; c1++) {
      let col = -1, mask = 0, ok = true;
      for (let r = r0; r <= r1 && ok; r++) for (let c = c0; c <= c1; c++) { const v = g[r * C + c]; if (v < 0) continue; if (col < 0) col = v; else if (v !== col) { ok = false; break; } mask |= 1 << (r * C + c); }
      if (ok && mask) sets.add(mask);
    }
    const all = [...sets];
    return all.filter(m => !all.some(o => o !== m && (o & m) === m));
  };
  const go = (g, d, seen) => {
    const cols = new Set(g.filter(v => v >= 0));
    if (!cols.size) return true;
    if (cols.size > d || --budget < 0) return false;
    const k = g.join(''); if (seen.has(k)) return false; seen.add(k);
    for (const m of moves(g)) if (go(g.map((v, i) => m >> i & 1 ? -1 : v), d - 1, seen)) return true;
    return false;
  };
  for (let d = 1; d <= limit; d++) { if (go(grid.flat(), d, new Set())) return d; if (budget < 0) return 0; }
  return 0;
}
function newLevel() {
  // [columns, rows, colours, build steps, largest build rectangle, bands the board must need]
  const [cols, rows, k, steps, side, target] = [[4, 4, 2, 6, 2, 3], [4, 5, 3, 8, 2, 4], [5, 5, 3, 10, 3, 5], [5, 6, 4, 12, 3, 6], [5, 6, 4, 14, 3, 7], [5, 6, 5, 16, 3, 8]][level - 1] || [5, 6, 5, 18, 3, 9];
  C = cols; R = rows;
  let need = 0;
  for (let tries = 0; need !== target && (tries < 300 || !need); tries++) { start = generate(C, R, k, steps, side); need = minBands(start, target); }
  bands = need + (level <= 2 ? 1 : 0); // one spare band while learning
  S = Math.min(300 / C, 360 / R) | 0; ox = (360 - C * S) / 2; oy = (420 - R * S) / 2;
  startLevel(level === 1 ? 'Drag a band around beads of one colour to collect them.'
    : level === 2 ? 'A band may stretch over empty spaces, so clear what is in the way first.' : '');
  restart();
}
function restart() { grid = start.map(r => r.slice()); left = bands; history = []; ended = false; drag = null; hide(); render(true); }
function undo() {
  if (!history.length) return;
  const s = history.pop(); grid = s.grid; left = s.left; ended = false; hide(); render(); sfx.undo();
}
function render(fresh) {
  svg.textContent = '';
  for (let r = 0; r <= R; r++) for (let c = 0; c <= C; c++) svg.append(el('circle', { cx: ox + c * S, cy: oy + r * S, r: 4, class: 'peg' }));
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if (grid[r][c] < 0) continue;
    const x = ox + (c + .5) * S, y = oy + (r + .5) * S, rad = S * .32;
    const g = el('g', { class: 'bead', id: `b${r}_${c}` });
    if (fresh) g.style.animationDelay = (r + c) * 25 + 'ms'; else g.style.animation = 'none';
    g.append(el('circle', { cx: x, cy: y, r: rad, fill: PALETTE[grid[r][c]] }),
             el('ellipse', { cx: x - rad * .3, cy: y - rad * .4, rx: rad * .32, ry: rad * .2, fill: 'rgba(255,255,255,.55)' }));
    svg.append(g);
  }
  band = el('rect', { id: 'band', rx: 16 }); svg.append(band);
  $('foot').textContent = '';
  for (let i = 0; i < bands; i++) { const d = document.createElement('div'); d.className = 'loop' + (i >= left ? ' used' : ''); $('foot').append(d); }
}
function cellAt(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.floor((q.x - ox) / S), Math.floor((q.y - oy) / S)];
}
const clamp = (v, hi) => Math.max(0, Math.min(hi, v));
// what the current band holds: the bead cells inside it and the colours among them
function inside(d) {
  const c0 = Math.min(d.c0, d.c1), c1 = Math.max(d.c0, d.c1), r0 = Math.min(d.r0, d.r1), r1 = Math.max(d.r0, d.r1), cells = [], cols = new Set();
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (grid[r][c] >= 0) { cells.push([r, c]); cols.add(grid[r][c]); }
  return { c0, c1, r0, r1, cells, cols };
}
function drawBand() {
  const b = inside(drag);
  band.setAttribute('x', ox + b.c0 * S - 5); band.setAttribute('y', oy + b.r0 * S - 5);
  band.setAttribute('width', (b.c1 - b.c0 + 1) * S + 10); band.setAttribute('height', (b.r1 - b.r0 + 1) * S + 10);
  band.setAttribute('class', 'on' + (b.cols.size > 1 ? ' bad' : b.cols.size ? '' : ' none'));
  band.style.stroke = b.cols.size === 1 ? PALETTE[[...b.cols][0]] : '';
  return b;
}
svg.addEventListener('pointerdown', e => {
  if (ended) return;
  const [c, r] = cellAt(e);
  if (c < 0 || r < 0 || c >= C || r >= R) return;
  audio(); e.preventDefault(); svg.setPointerCapture(e.pointerId);
  drag = { c0: c, r0: r, c1: c, r1: r }; drawBand(); tone(260, .06, { type: 'triangle', v: .14 });
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const [c, r] = cellAt(e), nc = clamp(c, C - 1), nr = clamp(r, R - 1);
  if (nc === drag.c1 && nr === drag.r1) return;
  drag.c1 = nc; drag.r1 = nr;
  const b = drawBand(), area = (b.c1 - b.c0 + 1) * (b.r1 - b.r0 + 1);
  tone(240 + area * 28, .07, { to: 270 + area * 28, type: 'triangle', v: .12 }); // the band stretching
});
function release() {
  if (!drag) return;
  const b = inside(drag); drag = null;
  if (!b.cols.size) { band.setAttribute('class', ''); return; }
  if (b.cols.size > 1) {
    sfx.blocked(); buzz(30); band.classList.add('shake');
    setTimeout(() => band.setAttribute('class', ''), 320); return;
  }
  history.push({ grid: grid.map(r => r.slice()), left });
  const color = PALETTE[[...b.cols][0]];
  tone(190, .25, { to: 85, type: 'sawtooth', v: .16 }); tone(760, .08, { to: 380, v: .2 }); // twang
  b.cells.forEach(([r, c], i) => {
    burst(...center($(`b${r}_${c}`)), color, 8); $(`b${r}_${c}`).remove(); grid[r][c] = -1;
    sfx.pop(480 + i * 70, .08 + i * .05);
  });
  left--; band.classList.add('snap'); const old = band;
  [...$('foot').children].forEach((d, i) => d.classList.toggle('used', i >= left));
  setTimeout(() => { if (!drag) old.setAttribute('class', ''); }, 320);
  if (!grid.flat().some(v => v >= 0)) { ended = true; win('All snapped up!'); }
  else if (!left) { ended = true; lose('Out of bands!', 'Beads are left and no bands remain.'); }
}
svg.addEventListener('pointerup', release);
svg.addEventListener('pointercancel', () => { drag = null; band.setAttribute('class', ''); });
const game = { newLevel, undo, restart };

/* ---------- boot ---------- */
if (game.undo) $('undo').onclick = game.undo; else $('undo').style.display = 'none';
$('restart').onclick = () => { sfx.ui(); game.restart(); };
