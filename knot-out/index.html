<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Knot Out</title>
<style>
  :root {
    --bg1: #1b1035; --bg2: #0d0a1f; --panel: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.12); --text: #f4efff; --muted: #a99fca;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text); overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    background:
      radial-gradient(60vmax 60vmax at 10% -10%, rgba(255,77,109,.28), transparent 60%),
      radial-gradient(55vmax 55vmax at 110% 20%, rgba(58,134,255,.28), transparent 60%),
      radial-gradient(60vmax 60vmax at 50% 120%, rgba(185,103,255,.30), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
  }
  #app {
    height: 100dvh; max-width: 440px; margin: 0 auto; padding: 14px 16px 18px;
    display: flex; flex-direction: column; gap: 12px;
  }
  header { display: flex; align-items: center; gap: 10px; }
  h1 {
    margin: 0; font-size: 26px; font-weight: 900; letter-spacing: .5px; flex: 1;
    background: linear-gradient(90deg, #ff4d6d, #ffb703, #3ddc84, #00d4e0, #b967ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pill {
    font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .icon {
    width: 38px; height: 38px; border-radius: 12px; font-size: 18px; font-weight: 800;
    background: var(--panel); border: 1px solid var(--line);
    transition: transform .12s, background .2s;
  }
  .icon:active { transform: scale(.9); }
  .icon.off { opacity: .45; text-decoration: line-through; }

  #board {
    flex: 1; min-height: 0; border-radius: 26px; position: relative;
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.09) 1.2px, transparent 1.6px) 0 0 / 22px 22px,
      linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border: 1px solid var(--line);
    box-shadow: inset 0 0 50px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.35);
  }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .rope { cursor: pointer; }
  .rope path { fill: none; stroke-linecap: round; }
  .rope .o { stroke: #120a26; stroke-opacity: .7; stroke-width: 18; }
  .rope .b { stroke: var(--c); stroke-width: 12; }
  .rope .t { stroke: rgba(0,0,0,.2); stroke-width: 12; stroke-dasharray: 2.5 8; stroke-linecap: butt; }
  .rope .s { stroke: rgba(255,255,255,.4); stroke-width: 3; }
  .rope .h { stroke: transparent; stroke-width: 28; pointer-events: stroke; }
  .rope circle.k { fill: var(--c); stroke: #120a26; stroke-width: 3; }
  .rope circle.d { fill: rgba(255,255,255,.7); pointer-events: none; }
  .rope.gone { pointer-events: none; }
  .rope.gone .o, .rope.gone .b { transition: stroke-dashoffset .3s cubic-bezier(.5,0,.8,.4); }
  .rope.gone .t, .rope.gone .s, .rope.gone .end { opacity: 0; }
  .rope.shake { animation: shake .32s; }
  .rope.flash { animation: flash .45s; }
  @keyframes shake {
    20% { transform: translate(-5px, 2px); } 40% { transform: translate(5px, -2px); }
    60% { transform: translate(-3px, 1px); } 80% { transform: translate(3px, -1px); }
  }
  @keyframes flash { 30% { filter: brightness(1.9) drop-shadow(0 0 8px #fff); } }

  #tip { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; margin: -2px 0; }

  #rack {
    display: flex; justify-content: center; gap: 14px; padding: 14px;
    border-radius: 22px; background: var(--panel); border: 1px solid var(--line);
  }
  .slot {
    width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(0,0,0,.28); border: 2px dashed rgba(255,255,255,.18);
    transition: border-color .2s, box-shadow .2s;
  }
  #rack.warn .slot:empty { border-color: #ff4d6d; box-shadow: 0 0 14px rgba(255,77,109,.6); }
  .coil {
    width: 42px; height: 42px; border-radius: 50%;
    background:
      radial-gradient(circle, #160d2c 0 5px, transparent 5.5px),
      repeating-radial-gradient(circle, var(--c) 0 4px, color-mix(in srgb, var(--c) 62%, #000) 4px 6.5px);
    box-shadow: 0 4px 10px rgba(0,0,0,.45), 0 0 16px color-mix(in srgb, var(--c) 55%, transparent),
      inset 0 2px 3px rgba(255,255,255,.45);
  }
  .coil.in { animation: pop-in .25s cubic-bezier(.3,1.8,.5,1); }
  .coil.pop { animation: pop-out .28s forwards; }
  .coil.fly { position: fixed; z-index: 20; pointer-events: none; margin: 0; }
  @keyframes pop-in { from { transform: scale(.6); } }
  @keyframes pop-out { 40% { transform: scale(1.35); } to { transform: scale(0) rotate(180deg); opacity: 0; } }
  .bit { position: fixed; z-index: 30; width: 9px; height: 9px; border-radius: 3px; pointer-events: none; }

  #ov {
    position: fixed; inset: 0; z-index: 40; display: none; place-items: center;
    background: rgba(8,5,20,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #ov.show { display: grid; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } }
  .card {
    width: min(300px, 82vw); padding: 26px 22px; border-radius: 26px; text-align: center;
    background: linear-gradient(180deg, #2b1a55, #1a1036); border: 1px solid var(--line);
    box-shadow: 0 24px 60px rgba(0,0,0,.6); animation: pop-in .35s cubic-bezier(.3,1.6,.5,1);
  }
  .card h2 { margin: 0 0 6px; font-size: 28px; font-weight: 900; }
  .card p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .btns { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 13px 10px; border-radius: 16px; font-weight: 800; font-size: 15px;
    background: linear-gradient(180deg, #ffca3a, #ff8f1f); color: #2a1500;
    box-shadow: 0 5px 0 #b85c00; transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b85c00; }
  .btn.alt { background: linear-gradient(180deg, #5b4a8f, #3d2f6b); color: var(--text); box-shadow: 0 5px 0 #241a45; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>KNOT OUT</h1>
    <span class="pill" id="lvl">Level 1</span>
    <button class="icon" id="undo" title="Undo" aria-label="Undo">↶</button>
    <button class="icon" id="restart" title="Restart" aria-label="Restart">↻</button>
    <button class="icon" id="mute" title="Sound" aria-label="Sound">♪</button>
  </header>
  <div id="board"><svg id="svg" viewBox="0 0 360 420" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="tip"></div>
  <div id="rack"></div>
</div>
<div id="ov"><div class="card"><h2 id="ovT"></h2><p id="ovP"></p><div class="btns" id="ovB"></div></div></div>

<script>
'use strict';
const W = 360, H = 420, HOOKS = 4, SAMPLES = 60, NEAR2 = 12 * 12;
const PALETTE = ['#ff4d6d', '#ffb703', '#3ddc84', '#3a86ff', '#b967ff', '#00d4e0'];
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('svg'), rackEl = $('rack'), ovEl = $('ov');
const rnd = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

let level = 1, ropes = [], ov = [], rack = [], history = [], busy = false, ended = false, muted = false;
try { level = Math.max(1, +localStorage.getItem('knotout.level') || 1); muted = localStorage.getItem('knotout.muted') === '1'; } catch (e) {}

/* ---------- sound ---------- */
let ac, master, wet;
function audio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .55;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    wet = ac.createGain(); wet.gain.value = .28;
    const delay = ac.createDelay(); delay.delayTime.value = .17;
    const fb = ac.createGain(); fb.gain.value = .32;
    wet.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(comp);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, d, o = {}) {
  if (muted) return;
  const a = audio(), s = a.currentTime + (o.t || 0), osc = a.createOscillator(), g = a.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, s);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, s + d);
  g.gain.setValueAtTime(.0001, s);
  g.gain.exponentialRampToValueAtTime(o.v || .3, s + .012);
  g.gain.exponentialRampToValueAtTime(.0001, s + d);
  osc.connect(g); g.connect(master); if (o.echo) g.connect(wet);
  osc.start(s); osc.stop(s + d + .03);
}
function whoosh(d, from, to, v = .25) {
  if (muted) return;
  const a = audio(), s = a.currentTime, n = Math.ceil(a.sampleRate * d);
  const buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(from, s); f.frequency.exponentialRampToValueAtTime(to, s + d);
  g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(v, s + d * .3);
  g.gain.exponentialRampToValueAtTime(.0001, s + d);
  src.connect(f); f.connect(g); g.connect(master); src.start(s);
}
const sfx = {
  pull() { whoosh(.26, 500, 3200); tone(260, .22, { to: 880, type: 'triangle', v: .22 }); },
  land(n) { tone(440 + n * 70, .09, { to: 300 + n * 50, v: .35 }); tone(900 + n * 120, .05, { type: 'triangle', v: .12 }); },
  blocked() { tone(150, .1, { to: 95, type: 'square', v: .16 }); tone(130, .12, { to: 80, type: 'square', v: .16, t: .11 }); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => { tone(f, .3, { t: i * .07, v: .26, echo: 1 }); tone(f * 2, .2, { t: i * .07, type: 'triangle', v: .08, echo: 1 }); }); },
  win() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .35, { t: i * .09, type: 'triangle', v: .26, echo: 1 }));
          [523, 659, 784, 1047].forEach(f => tone(f, .9, { t: .6, v: .16, echo: 1 })); },
  fail() { [392, 330, 262, 196].forEach((f, i) => tone(f, .28, { t: i * .14, to: f * .94, type: 'sawtooth', v: .13 })); },
  undo() { tone(700, .1, { to: 420, type: 'triangle', v: .22 }); },
  ui() { tone(620, .07, { to: 820, type: 'triangle', v: .18 }); }
};

/* ---------- level generation ---------- */
function sample(p1, c, p2) {
  const pts = [];
  for (let i = 0; i <= SAMPLES; i++) {
    const t = i / SAMPLES, u = 1 - t;
    pts.push({ x: u * u * p1.x + 2 * u * t * c.x + t * t * p2.x, y: u * u * p1.y + 2 * u * t * c.y + t * t * p2.y });
  }
  return pts;
}
// number of points of a that sit on top of b
function touch(a, b) {
  let n = 0;
  for (const p of a) for (const q of b) { const dx = p.x - q.x, dy = p.y - q.y; if (dx * dx + dy * dy < NEAR2) { n++; break; } }
  return n;
}
function makeRope(list) {
  let cand;
  for (let tries = 0; tries < 400; tries++) {
    const p1 = { x: rnd(28, W - 28), y: rnd(28, H - 28) }, p2 = { x: rnd(28, W - 28), y: rnd(28, H - 28) };
    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy);
    if (len < 170) continue;
    const bend = rnd(-95, 95);
    const c = { x: Math.min(W - 16, Math.max(16, (p1.x + p2.x) / 2 - dy / len * bend)),
                y: Math.min(H - 16, Math.max(16, (p1.y + p2.y) / 2 + dx / len * bend)) };
    cand = { p1, p2, c, pts: sample(p1, c, p2) };
    if (tries > 300) break; // give up on the polish rules rather than loop forever
    const endsClash = list.some(r => [r.p1, r.p2].some(e => [p1, p2].some(m => Math.hypot(e.x - m.x, e.y - m.y) < 34)));
    if (endsClash) continue;
    const t = list.map(r => touch(cand.pts, r.pts));
    if (t.some(n => n > 16)) continue;               // runs alongside another rope: hard to read
    if (list.length && !t.some(n => n > 0)) continue; // must be part of the tangle
    break;
  }
  return cand;
}
// colour order (top rope first) that can always be cleared without filling the rack
function colourOrder(k) {
  const left = Array(k).fill(3), held = Array(k).fill(0), seq = [];
  for (let n = 0; n < k * 3; n++) {
    const ok = [];
    for (let c = 0; c < k; c++) {
      if (!left[c]) continue;
      const h = held.slice(); h[c] = (h[c] + 1) % 3;
      const singles = h.filter(x => x === 1).length, doubles = h.filter(x => x === 2).length;
      if (singles + doubles * 2 < HOOKS && !(singles === 3)) ok.push(c);
    }
    const c = ok[Math.random() * ok.length | 0];
    seq.push(c); left[c]--; held[c] = (held[c] + 1) % 3;
  }
  return seq;
}
function newLevel() {
  const k = [2, 3, 4, 4, 5, 5][level - 1] || 6, n = k * 3;
  const cols = shuffle(PALETTE.slice()).slice(0, k), order = colourOrder(k);
  ropes = [];
  for (let i = 0; i < n; i++) { const r = makeRope(ropes); r.id = r.z = i; r.removed = false; ropes.push(r); }
  ropes.forEach(r => r.color = cols[order[n - 1 - r.z]]); // highest z comes off first
  ov = ropes.map(a => ropes.map(b => a !== b && touch(a.pts, b.pts) > 0));
  reset();
  $('lvl').textContent = 'Level ' + level;
  $('tip').textContent = level === 1 ? 'Tap a rope with nothing lying on top of it. Collect 3 of a colour.'
    : level === 2 ? 'Four hooks only. Fill them without a match and you lose.' : '';
  try { localStorage.setItem('knotout.level', level); } catch (e) {}
}
function reset() {
  ropes.forEach(r => r.removed = false);
  rack = []; history = []; busy = false; ended = false;
  ovEl.classList.remove('show');
  renderBoard(); renderRack();
}

/* ---------- rendering ---------- */
function el(name, attrs) { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function renderBoard() {
  svg.textContent = '';
  for (const r of ropes) {
    if (r.removed) continue;
    const d = `M${r.p1.x} ${r.p1.y} Q${r.c.x} ${r.c.y} ${r.p2.x} ${r.p2.y}`;
    const g = el('g', { class: 'rope' });
    g.style.setProperty('--c', r.color);
    for (const cls of ['o', 'b', 't', 's', 'h']) g.append(el('path', { d, class: cls }));
    [r.p1, r.p2].forEach((p, i) => {
      g.append(el('circle', { cx: p.x, cy: p.y, r: 10, class: 'k' + (i ? ' end' : '') }),
               el('circle', { cx: p.x - 2.5, cy: p.y - 2.5, r: 2.6, class: 'd' + (i ? ' end' : '') }));
    });
    g.addEventListener('pointerdown', e => { e.preventDefault(); tap(r); });
    r.g = g; svg.append(g);
  }
}
function coil(color, cls) { const c = document.createElement('div'); c.className = 'coil ' + (cls || ''); c.style.setProperty('--c', color); return c; }
function renderRack(popLast) {
  rackEl.textContent = '';
  for (let i = 0; i < HOOKS; i++) {
    const s = document.createElement('div'); s.className = 'slot';
    if (rack[i]) s.append(coil(rack[i], popLast && i === rack.length - 1 ? 'in' : ''));
    rackEl.append(s);
  }
  rackEl.classList.toggle('warn', rack.length === HOOKS - 1);
}
function burst(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div'); b.className = 'bit';
    b.style.cssText = `left:${x - 4}px;top:${y - 4}px;background:${color}`;
    document.body.append(b);
    const ang = rnd(0, Math.PI * 2), dist = rnd(30, 95);
    b.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 },
               { transform: `translate(${Math.cos(ang) * dist}px,${Math.sin(ang) * dist + 30}px) scale(.2) rotate(${rnd(-360, 360)}deg)`, opacity: 0 }],
              { duration: rnd(450, 800), easing: 'cubic-bezier(.1,.7,.3,1)' }).onfinish = () => b.remove();
  }
}

/* ---------- play ---------- */
function tap(r) {
  if (busy || ended || r.removed) return;
  audio();
  const blockers = ropes.filter(o => !o.removed && o.z > r.z && ov[r.id][o.id]);
  if (blockers.length) {
    sfx.blocked();
    replay(r.g, 'shake'); blockers.forEach(b => replay(b.g, 'flash'));
    if (navigator.vibrate) navigator.vibrate(30);
    return;
  }
  busy = true; r.removed = true; history.push(r.id);
  sfx.pull();
  // reel the rope in toward its first end
  const g = r.g, len = g.querySelector('.b').getTotalLength();
  g.querySelectorAll('.o,.b').forEach(p => { p.style.strokeDasharray = len + ' ' + len; p.style.strokeDashoffset = 0; });
  g.getBoundingClientRect();
  g.classList.add('gone');
  g.querySelectorAll('.o,.b').forEach(p => p.style.strokeDashoffset = len);
  setTimeout(() => {
    const pt = svg.createSVGPoint(); pt.x = r.p1.x; pt.y = r.p1.y;
    const from = pt.matrixTransform(svg.getScreenCTM());
    const to = rackEl.children[rack.length].getBoundingClientRect();
    g.remove();
    const c = coil(r.color, 'fly');
    c.style.left = from.x - 21 + 'px'; c.style.top = from.y - 21 + 'px';
    document.body.append(c);
    const dx = to.left + to.width / 2 - from.x, dy = to.top + to.height / 2 - from.y;
    c.animate([{ transform: 'translate(0,0) scale(.5)' },
               { transform: `translate(${dx * .5}px,${dy * .5 - 40}px) scale(1.25)`, offset: .55 },
               { transform: `translate(${dx}px,${dy}px) scale(1)` }],
              { duration: 300, easing: 'ease-in-out' }).onfinish = () => { c.remove(); land(r.color); };
  }, 260);
}
function replay(node, cls) { node.classList.remove(cls); node.getBoundingClientRect(); node.classList.add(cls); }
function land(color) {
  rack.push(color); renderRack(true); sfx.land(rack.length);
  if (rack.filter(c => c === color).length < 3) return settle();
  setTimeout(() => {
    sfx.clear();
    [...rackEl.children].forEach((s, i) => {
      if (rack[i] !== color) return;
      s.firstChild.classList.add('pop');
      const b = s.getBoundingClientRect(); burst(b.left + b.width / 2, b.top + b.height / 2, color);
    });
    setTimeout(() => { rack = rack.filter(c => c !== color); renderRack(); settle(); }, 280);
  }, 130);
}
function settle() {
  if (ropes.every(r => r.removed)) {
    ended = true; sfx.win();
    for (let i = 0; i < 7; i++) setTimeout(() => burst(rnd(40, innerWidth - 40), rnd(80, innerHeight * .6), PALETTE[i % PALETTE.length], 16), i * 110);
    setTimeout(() => show('Untangled!', 'Level ' + level + ' cleared.', [['Next level', () => { level++; newLevel(); }]]), 650);
  } else if (rack.length >= HOOKS) {
    ended = true; sfx.fail();
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    setTimeout(() => show('Rack full!', 'No hook left and no match of three.', [['Undo', undo, 'alt'], ['Retry', reset]]), 500);
  }
  busy = false;
}
function undo() {
  if (busy || !history.length) return;
  ropes[history.pop()].removed = false;
  rack = [];
  for (const id of history) { const c = ropes[id].color; rack.push(c); if (rack.filter(x => x === c).length === 3) rack = rack.filter(x => x !== c); }
  ended = false; ovEl.classList.remove('show');
  renderBoard(); renderRack(); sfx.undo();
}
function show(title, text, buttons) {
  $('ovT').textContent = title; $('ovP').textContent = text;
  const box = $('ovB'); box.textContent = '';
  for (const [label, fn, cls] of buttons) {
    const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label;
    b.onclick = () => { sfx.ui(); fn(); }; box.append(b);
  }
  ovEl.classList.add('show');
}

$('undo').onclick = undo;
$('restart').onclick = () => { if (!busy) { sfx.ui(); reset(); } };
$('mute').onclick = () => {
  muted = !muted; $('mute').classList.toggle('off', muted);
  try { localStorage.setItem('knotout.muted', muted ? '1' : '0'); } catch (e) {}
  sfx.ui();
};
$('mute').classList.toggle('off', muted);
newLevel();
</script>
</body>
</html>
